# Example configuration; integrations may load this with a YAML library.
project:
  name: robot-knowledgebase
  environment: development
paths:
  knowledge: knowledge
  raw: data/raw
  processed: data/processed
  embeddings: data/embeddings
ingestion:
  supported_extensions: [".md", ".markdown", ".txt"]
  chunk_size: 1000
  chunk_overlap: 150
embeddings:
  provider: null
  model: null
vector_store:
  provider: null
  collection: robot_knowledge
generation:
  provider: null
  model: null

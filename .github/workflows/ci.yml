name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # actions/checkout v4 — pinned to the commit currently resolved by the official v4 tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-python v5 — pinned to the commit currently resolved by the official v5 tag.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      # astral-sh/setup-uv v10.3.3 — pinned to its verified release commit.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked project and development tools
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run --locked ruff check .
      - name: Verify STS3215 layout, encoding, and converter metadata against pinned rustypot source
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/pollen-robotics/rustypot/7aa85e13143594ea4fd4ed9f29e3e29d39b5de85/src/servo/feetech/sts3215.rs \
            --output "${RUNNER_TEMP}/sts3215.rs"
          echo "4dbb829228d13492e7dcf80bfbd3d48642a9bbc58c8158e6bdcec1cc35811fa7  ${RUNNER_TEMP}/sts3215.rs" | sha256sum --check --strict
          sha256sum "${RUNNER_TEMP}/sts3215.rs"
          python knowledge/projects/reference-desktop-manipulator/software/register_definition_audit.py \
            --source "${RUNNER_TEMP}/sts3215.rs"
      - name: Test
        run: uv run --locked pytest

  python-sbom:
    name: Generate Python runtime and development SBOMs
    runs-on: ubuntu-latest
    steps:
      # Keep the SBOM job independent from the test matrix and scan two explicitly scoped environments.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      # astral-sh/setup-uv v10.3.3 — pinned to its verified release commit.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked runtime and development environments separately
        run: |
          export UV_PROJECT_ENVIRONMENT="${RUNNER_TEMP}/sbom-runtime"
          uv sync --locked
          export UV_PROJECT_ENVIRONMENT="${RUNNER_TEMP}/sbom-development"
          uv sync --locked --extra dev
      - name: Install pinned CycloneDX generator in a separate tool environment
        run: |
          python -m venv "${RUNNER_TEMP}/sbom-generator"
          "${RUNNER_TEMP}/sbom-generator/bin/python" -m pip install "cyclonedx-bom==7.6.0"
          "${RUNNER_TEMP}/sbom-generator/bin/cyclonedx-py" --version
      - name: Generate and validate CycloneDX 1.7 SBOMs
        run: |
          mkdir -p sbom
          "${RUNNER_TEMP}/sbom-generator/bin/cyclonedx-py" environment "${RUNNER_TEMP}/sbom-runtime/bin/python" \
            --pyproject pyproject.toml --spec-version 1.7 --validate --output-reproducible \
            --output-file sbom/robot-knowledgebase-runtime.cdx.json
          "${RUNNER_TEMP}/sbom-generator/bin/cyclonedx-py" environment "${RUNNER_TEMP}/sbom-development/bin/python" \
            --pyproject pyproject.toml --spec-version 1.7 --validate --output-reproducible \
            --output-file sbom/robot-knowledgebase-development.cdx.json
      - name: Archive observed environment inventories
        run: |
          uv pip freeze --python "${RUNNER_TEMP}/sbom-runtime/bin/python" > sbom/runtime-python-freeze.txt
          uv pip freeze --python "${RUNNER_TEMP}/sbom-development/bin/python" > sbom/development-python-freeze.txt
          "${RUNNER_TEMP}/sbom-generator/bin/python" -m pip freeze --all > sbom/generator-tool-freeze.txt
          sha256sum sbom/* > sbom/SHA256SUMS
      # actions/upload-artifact v4 — pinned to the commit currently resolved by the official v4 tag.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-sbom-cyclonedx-1.7
          path: sbom/
          if-no-files-found: error
          retention-days: 30

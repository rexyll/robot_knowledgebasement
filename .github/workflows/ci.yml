name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # actions/checkout v7.0.1 — Node 24, pinned to the verified release commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-python v6.2.0 — Node 24, pinned to the verified release commit.
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python-version }}
      # astral-sh/setup-uv v10.3.3 — pinned to its verified release commit.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked project and development tools
        run: uv sync --locked --extra dev
      - name: Validate Stäubli lifecycle traceability manifest
        run: |
          uv run --locked python scripts/validate_staubli_lifecycle_manifest.py \
            --report "${RUNNER_TEMP}/staubli-manifest-validation.json"
      - name: Archive Stäubli lifecycle validation report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: staubli-lifecycle-validation-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/staubli-manifest-validation.json
          if-no-files-found: warn
          retention-days: 14
      - name: Validate Stäubli RACE/EXEC test catalog bidirectional traceability
        run: |
          uv run --locked python scripts/validate_staubli_test_case_catalog.py \
            --report "${RUNNER_TEMP}/staubli-test-catalog-validation.json"
      - name: Archive Stäubli test catalog validation report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: staubli-test-catalog-validation-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/staubli-test-catalog-validation.json
          if-no-files-found: warn
          retention-days: 14
      - name: Validate Stäubli Runtime Evidence Bundle schema and policy
        run: |
          uv run --locked python scripts/validate_staubli_runtime_evidence_bundle.py \
            --report "${RUNNER_TEMP}/staubli-runtime-evidence-bundle-validation.json"
      - name: Archive Stäubli Runtime Evidence Bundle validation report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: staubli-runtime-evidence-bundle-validation-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/staubli-runtime-evidence-bundle-validation.json
          if-no-files-found: warn
          retention-days: 14
      - name: Build source and wheel with verified PEP 517 build dependency hashes
        run: uv build --require-build-hashes
      - name: Smoke-test extracted Python source distribution in an isolated environment
        if: matrix.python-version == '3.12'
        run: |
          set -euo pipefail
          smoke_root="${RUNNER_TEMP}/python-sdist-smoke"
          rm -rf "${smoke_root}"
          mkdir -p "${smoke_root}/extracted" "${smoke_root}/work"
          python - <<'PY'
          import os
          import tarfile
          from pathlib import Path

          archives = sorted(Path("dist").glob("*.tar.gz"))
          if len(archives) != 1:
              raise SystemExit(f"Expected one sdist, found {len(archives)}")
          archive = archives[0]
          source_name = archive.name.removesuffix(".tar.gz")
          with tarfile.open(archive, "r:gz") as package:
              package.extractall(
                  path=Path(os.environ["RUNNER_TEMP"]) / "python-sdist-smoke" / "extracted",
                  filter="data",
              )
          smoke_root = Path(os.environ["RUNNER_TEMP"]) / "python-sdist-smoke"
          source_root = smoke_root / "extracted" / source_name
          required = (
              source_root / "pyproject.toml",
              source_root / "src/robot_knowledgebase/__init__.py",
              source_root / "tests/test_chunker.py",
              source_root / "tests/test_markdown.py",
          )
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f"sdist is missing required files: {missing}")
          (smoke_root / "source-root.txt").write_text(str(source_root), encoding="utf-8")
          print(f"Extracted {archive} to {source_root}")
          PY
          export SDIST_SMOKE_ROOT="${smoke_root}"
          export SDIST_SMOKE_SOURCE="$(cat "${smoke_root}/source-root.txt")"
          export UV_PROJECT_ENVIRONMENT="${SDIST_SMOKE_ROOT}/venv"
          uv sync --locked --extra dev --no-install-project
          uv pip install --python "${SDIST_SMOKE_ROOT}/venv/bin/python" --no-deps "${SDIST_SMOKE_SOURCE}"
          module_path="$("${SDIST_SMOKE_ROOT}/venv/bin/python" -c 'import robot_knowledgebase; print(robot_knowledgebase.__file__)')"
          case "${module_path}" in
            "${SDIST_SMOKE_ROOT}/venv/"*) ;;
            *)
              echo "Installed package resolved outside the isolated sdist environment: ${module_path}" >&2
              exit 1
              ;;
          esac
          export SDIST_SMOKE_MODULE_PATH="${module_path}"
          (
            cd "${SDIST_SMOKE_ROOT}/work"
            env -u PYTHONPATH "${SDIST_SMOKE_ROOT}/venv/bin/python" -m pytest -q \
              "${SDIST_SMOKE_SOURCE}/tests/test_chunker.py" \
              "${SDIST_SMOKE_SOURCE}/tests/test_markdown.py" \
              --import-mode=importlib
          ) | tee "${SDIST_SMOKE_ROOT}/pytest-output.txt"
          "${SDIST_SMOKE_ROOT}/venv/bin/robot-kb" --version | tee "${SDIST_SMOKE_ROOT}/cli-output.txt"
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          from pathlib import Path

          smoke_root = Path(os.environ["SDIST_SMOKE_ROOT"])
          source_root = Path(os.environ["SDIST_SMOKE_SOURCE"])
          archives = sorted(Path("dist").glob("*.tar.gz"))
          if len(archives) != 1:
              raise SystemExit(f"Expected one sdist, found {len(archives)}")
          archive = archives[0]
          installed_module = Path(os.environ["SDIST_SMOKE_MODULE_PATH"])
          evidence = {
              "result": "PASS",
              "archive": archive.name,
              "archive_sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
              "python_version": platform.python_version(),
              "extracted_source_root": str(source_root),
              "installed_module_path": str(installed_module),
              "installed_module_isolated": installed_module.is_relative_to(smoke_root / "venv"),
              "test_files": [
                  "tests/test_chunker.py",
                  "tests/test_markdown.py",
              ],
              "pytest_output": (smoke_root / "pytest-output.txt").read_text(encoding="utf-8"),
              "console_entrypoint_output": (smoke_root / "cli-output.txt").read_text(encoding="utf-8"),
              "note": "Tests ran from the extracted sdist outside the repository checkout; package import resolved inside the isolated virtual environment.",
          }
          if not evidence["installed_module_isolated"]:
              raise SystemExit("Installed package did not resolve from the isolated virtual environment")
          output = smoke_root / "smoke-evidence.json"
          output.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(f"Wrote {output}")
          PY
      - name: Archive isolated Python sdist smoke-test evidence
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: python-sdist-smoke-test-evidence
          path: ${{ runner.temp }}/python-sdist-smoke/smoke-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Create file-level manifest for built Python distributions
        if: matrix.python-version == '3.12'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          mkdir -p "${RUNNER_TEMP}/python-distribution-audit"
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import tarfile
          import zipfile
          from email import policy
          from email.parser import BytesParser
          from pathlib import Path

          dist = Path("dist")
          wheels = sorted(dist.glob("*.whl"))
          sdists = sorted(dist.glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(
                  f"Expected exactly one wheel and one .tar.gz sdist; "
                  f"found wheels={len(wheels)} sdists={len(sdists)}"
              )

          def digest(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def metadata_fields(raw: bytes) -> dict:
              message = BytesParser(policy=policy.default).parsebytes(raw)
              keys = (
                  "Name",
                  "Version",
                  "Metadata-Version",
                  "Summary",
                  "License",
                  "License-Expression",
                  "License-File",
              )
              return {
                  key: message.get_all(key, [])
                  for key in keys
                  if message.get_all(key, [])
              }

          records = []
          for archive in [*wheels, *sdists]:
              record = {
                  "archive": archive.name,
                  "archive_sha256": digest(archive.read_bytes()),
                  "archive_size_bytes": archive.stat().st_size,
                  "members": [],
                  "distribution_metadata": {},
              }
              if archive.suffix == ".whl":
                  with zipfile.ZipFile(archive) as package:
                      corrupt = package.testzip()
                      if corrupt:
                          raise SystemExit(f"Corrupt wheel member: {corrupt}")
                      for member in sorted(package.infolist(), key=lambda x: x.filename):
                          if member.is_dir():
                              continue
                          data = package.read(member.filename)
                          record["members"].append({
                              "path": member.filename,
                              "size_bytes": len(data),
                              "sha256": digest(data),
                              "type": "file",
                          })
                          if member.filename.endswith(".dist-info/METADATA"):
                              record["distribution_metadata"] = metadata_fields(data)
              else:
                  with tarfile.open(archive, "r:gz") as package:
                      for member in sorted(package.getmembers(), key=lambda x: x.name):
                          entry = {
                              "path": member.name,
                              "size_bytes": member.size,
                              "type": (
                                  "file" if member.isfile()
                                  else "directory" if member.isdir()
                                  else "symlink" if member.issym()
                                  else "hardlink" if member.islnk()
                                  else "other"
                              ),
                          }
                          if member.isfile():
                              source = package.extractfile(member)
                              if source is None:
                                  raise SystemExit(f"Could not read sdist member: {member.name}")
                              data = source.read()
                              entry["sha256"] = digest(data)
                              if member.name.endswith("/PKG-INFO") or member.name == "PKG-INFO":
                                  record["distribution_metadata"] = metadata_fields(data)
                          elif member.issym() or member.islnk():
                              entry["link_target"] = member.linkname
                          record["members"].append(entry)
              records.append(record)

          manifest = {
              "schema_version": 1,
              "workflow_sha": os.environ.get("GITHUB_SHA"),
              "source_commit_sha": os.environ.get("PR_HEAD_SHA"),
              "base_commit_sha": os.environ.get("PR_BASE_SHA") or None,
              "python_version": platform.python_version(),
              "build_command": "uv build --require-build-hashes",
              "scope": "exact files contained in the wheel and sdist built by this CI job",
              "license_interpretation": (
                  "Metadata fields are recorded as package declarations only; "
                  "they do not prove rights-holder authority or license coverage "
                  "for every file."
              ),
              "distributions": records,
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "python-distribution-audit" / "distribution-manifest.json"
          output.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(f"Wrote {output}")
          for record in records:
              print(
                  f"{record['archive']}: {len(record['members'])} members, "
                  f"sha256={record['archive_sha256']}"
              )
          PY
      - name: Archive built Python distribution manifest
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: python-distribution-file-manifest
          path: ${{ runner.temp }}/python-distribution-audit/distribution-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Lint
        run: uv run --locked ruff check .
      - name: Verify STS3215 layout, encoding, and converter metadata against pinned rustypot source
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/pollen-robotics/rustypot/7aa85e13143594ea4fd4ed9f29e3e29d39b5de85/src/servo/feetech/sts3215.rs \
            --output "${RUNNER_TEMP}/sts3215.rs"
          echo "4dbb829228d13492e7dcf80bfbd3d48642a9bbc58c8158e6bdcec1cc35811fa7  ${RUNNER_TEMP}/sts3215.rs" | sha256sum --check --strict
          sha256sum "${RUNNER_TEMP}/sts3215.rs"
          python knowledge/projects/reference-desktop-manipulator/software/register_definition_audit.py \
            --source "${RUNNER_TEMP}/sts3215.rs"
      - name: Test
        run: uv run --locked pytest

  python-sbom:
    name: Generate Python runtime and development SBOMs
    runs-on: ubuntu-latest
    steps:
      # Keep the SBOM job independent from the test matrix and scan two explicitly scoped environments.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      # astral-sh/setup-uv v10.3.3 — pinned to its verified release commit.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked runtime and development environments separately
        run: |
          export UV_PROJECT_ENVIRONMENT="${RUNNER_TEMP}/sbom-runtime"
          uv sync --locked
          export UV_PROJECT_ENVIRONMENT="${RUNNER_TEMP}/sbom-development"
          uv sync --locked --extra dev
      - name: Install hash-locked CycloneDX generator toolchain in a separate environment
        run: |
          python -m venv --without-pip "${RUNNER_TEMP}/sbom-generator"
          uv pip sync --require-hashes --python "${RUNNER_TEMP}/sbom-generator/bin/python" requirements-sbom-tools.txt
          "${RUNNER_TEMP}/sbom-generator/bin/cyclonedx-py" --version
      - name: Install hash-locked PEP 517 build tools in a separate audit environment
        run: |
          python -m venv --without-pip "${RUNNER_TEMP}/sbom-build-tools"
          uv pip sync --require-hashes --python "${RUNNER_TEMP}/sbom-build-tools/bin/python" requirements-build-tools.txt
      - name: Generate and validate CycloneDX 1.7 SBOMs
        run: |
          mkdir -p sbom
          "${RUNNER_TEMP}/sbom-generator/bin/cyclonedx-py" environment "${RUNNER_TEMP}/sbom-runtime/bin/python" \
            --pyproject pyproject.toml --spec-version 1.7 --validate --output-reproducible \
            --output-file sbom/robot-knowledgebase-runtime.cdx.json
          "${RUNNER_TEMP}/sbom-generator/bin/cyclonedx-py" environment "${RUNNER_TEMP}/sbom-development/bin/python" \
            --pyproject pyproject.toml --spec-version 1.7 --validate --output-reproducible \
            --output-file sbom/robot-knowledgebase-development.cdx.json
          "${RUNNER_TEMP}/sbom-generator/bin/cyclonedx-py" environment "${RUNNER_TEMP}/sbom-generator/bin/python" \
            --pyproject pyproject.toml --spec-version 1.7 --validate --output-reproducible \
            --output-file sbom/robot-knowledgebase-generator.cdx.json
          "${RUNNER_TEMP}/sbom-generator/bin/cyclonedx-py" environment "${RUNNER_TEMP}/sbom-build-tools/bin/python" \
            --pyproject pyproject.toml --spec-version 1.7 --validate --output-reproducible \
            --output-file sbom/robot-knowledgebase-build-tools.cdx.json
      - name: Extract license metadata candidates from all four BOMs
        run: |
          python scripts/extract_python_license_metadata.py \
            --sbom-dir sbom \
            --output sbom/python-license-metadata-candidates.csv
      - name: Archive observed environment inventories
        run: |
          uv pip freeze --python "${RUNNER_TEMP}/sbom-runtime/bin/python" > sbom/runtime-python-freeze.txt
          uv pip freeze --python "${RUNNER_TEMP}/sbom-development/bin/python" > sbom/development-python-freeze.txt
          uv pip freeze --python "${RUNNER_TEMP}/sbom-generator/bin/python" > sbom/generator-tool-freeze.txt
          uv pip freeze --python "${RUNNER_TEMP}/sbom-build-tools/bin/python" > sbom/build-tool-freeze.txt
          (cd sbom && sha256sum * > SHA256SUMS)
      # actions/upload-artifact v6.0.0 — Node 24, pinned to the verified release commit.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: python-sbom-cyclonedx-1.7
          path: sbom/
          if-no-files-found: error
          retention-days: 30

  python-vulnerability-audit:
    name: Audit locked Python dependencies against OSV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Query OSV for every locked Python package version
        run: |
          python scripts/audit_python_vulnerabilities.py \
            --output security-audit/python-osv-vulnerability-report.json \
            --fail-on-findings
      - name: Archive machine-readable vulnerability report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: python-osv-vulnerability-report
          path: security-audit/python-osv-vulnerability-report.json
          if-no-files-found: warn
          retention-days: 30

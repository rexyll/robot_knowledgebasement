name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Verify STS3215 whitelist against pinned rustypot source
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/pollen-robotics/rustypot/7aa85e13143594ea4fd4ed9f29e3e29d39b5de85/src/servo/feetech/sts3215.rs \
            --output "${RUNNER_TEMP}/sts3215.rs"
          python knowledge/projects/reference-desktop-manipulator/software/register_definition_audit.py \
            --source "${RUNNER_TEMP}/sts3215.rs"
      - name: Test
        run: pytest
